<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7AAD47"/>
      <stop offset="100%" style="stop-color:#4A6F28"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Coin circle glow -->
  <circle cx="256" cy="210" r="130" fill="white" opacity="0.12"/>
  <circle cx="256" cy="210" r="104" fill="white" opacity="0.18"/>

  <!-- RM text (Ringgit Malaysia) -->
  <text
    x="256" y="247"
    font-family="Arial Black, Arial, sans-serif"
    font-size="116"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-2"
  >RM</text>

  <!-- Upward trend line -->
  <polyline
    points="108,395 200,335 295,358 404,278"
    fill="none"
    stroke="white"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <!-- Arrowhead -->
  <polyline
    points="372,262 404,278 390,312"
    fill="none"
    stroke="white"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
</svg>
